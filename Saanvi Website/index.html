<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You ✨</title>

  <link rel="stylesheet" href="css/main.css">
</head>

<body>

  <!-- AUDIO -->
  <audio id="bgm" src="assets/audio/porco.mp3" loop></audio>

  <!-- PORTAL -->
  <div id="portal">
    <div class="bubble">Tap to enter</div>
  </div>

  <!-- THEATER -->
  <section id="theater" class="section">
    <h1>Happy New Year ✨</h1>
    <button data-next="game">Continue</button>
  </section>

  <!-- GAME -->
  <section id="game" class="section">
    <canvas id="gameCanvas"></canvas>
    <p id="scoreText">Score: 0</p>
    <button id="skipGame" data-next="gallery">Skip</button>
  </section>  

  <!-- GALLERY -->
  <section id="gallery" class="section">
    <div id="cloudContainer"></div>
    <button data-next="constellation">Next</button>
  </section>  

  <!-- CONSTELLATION -->
  <section id="constellation" class="section">
    <svg viewBox="0 0 800 600" id="starMap"></svg>
    <div id="tooltip" class="tooltip"></div>
    <button data-next="letter">Finish</button>
  </section>  
  

  <!-- LETTER -->
  <section id="letter" class="section">
    <canvas id="meteorCanvas"></canvas>
    <div id="storybook">
      <div class="page" id="page1">
        <p>Dear [Friend],</p>
        <p>Here’s a little journey I made for you…</p>
      </div>
      <div class="page" id="page2">
        <p>…all our memories, inside jokes, and favorite things.</p>
      </div>
      <div class="page" id="page3">
        <p>Happy New Year ✨</p>
        <p>Love, Me</p>
      </div>
      <div id="playlist">
        <!-- Add your playlist embed or links here -->
        <p>🎵 Playlist here</p>
      </div>
    </div>
  </section>
  

  <!-- JS -->
  <script src="js/main.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/game.js"></script>
  <script src="js/constellation.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/meteorLetter.js"></script>



</body>
</html>
